name: Browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      # GitHub-hosted Ubuntu images ship Chrome already. Prefer that binary so
      # apt/Playwright browser downloads cannot stall the entire smoke suite.
      - name: Discover browser
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "ECHO12_CHROMIUM=$(command -v "$browser")" >> "$GITHUB_ENV"
              echo "Using preinstalled $browser"
              exit 0
            fi
          done
          python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
